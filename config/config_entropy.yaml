# Configuration for CART Decision Tree Training with Entropy Criterion
# For DUAggregateData.csv dataset

# Feature columns to use for training
features:
  - source                    # ios, android
  - estimated_usage_bins      # LTE_1_HOUR, etc.
  - city                      # Bangalore, Hyderabad, Delhi NCR, etc.
  - zone                      # Zone numbers
  - zone_demand_popularity    # POPULARITY_INDEX_1, POPULARITY_INDEX_2, etc.
  - dayType                   # WEEKEND, NORMAL_WEEKDAY, etc.
  - pickUpHourOfDay          # VERYLATE, LATENIGHT, MORNING, etc.
  - sla                      # Scheduled, On-demand, etc.
  - booking_type             # one_way_trip, etc.

# Target columns for binary classification
target_good_col: DU_good_cnt    # Count of positive class samples
target_bad_col: DU_Bad_Count    # Count of negative class samples

# Hyperparameters for CART algorithm (sklearn-compatible)
hyperparameters:
  criterion: "entropy"             # Using entropy for information-theoretic splits
  max_depth: 8                     # Slightly deeper tree with entropy
  min_samples_split: 50            # Conservative splitting
  min_samples_leaf: 80             # Larger leaf constraint
  min_weight_fraction_leaf: 0.0    # Not implemented for aggregate data
  max_features: "sqrt"             # Use square root of features for each split
  random_state: 42                 # For reproducible results
  max_leaf_nodes: null             # No leaf limit
  min_impurity_decrease: 0.002     # Slightly higher threshold
  ccp_alpha: 0.0                   # No pruning

# Model metadata
model_info:
  name: "DU_Aggregate_CART_Entropy"
  description: "CART decision tree with entropy criterion for ride-hailing demand-utilization prediction"
  dataset: "DUAggregateData.csv"
  algorithm: "CART with one-hot encoding and entropy splitting"
  target_type: "binary_classification"

# Optional: Feature engineering settings
feature_engineering:
  one_hot_encoding: true           # Always true for this implementation
  handle_missing: "skip"           # Skip rows with missing values

# Optional: Validation settings
validation:
  enable_validation: false         # Set to true to enable basic validation
  validation_checks:
    - "check_target_distribution"
    - "check_feature_completeness"
    - "check_sample_counts"